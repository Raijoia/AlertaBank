server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

spring:
  application:
    name: apigateway

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"

      routes:
        - id: servico-bancos
          uri: lb://SERVICO-BANCOS
          predicates:
            - Path=/bancos/**

        - id: servico-relatos
          uri: lb://SERVICO-RELATOS
          predicates:
            - Path=/relatos/**